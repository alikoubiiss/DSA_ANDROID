<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - v4 Ambientación - v6</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Usamos la misma imagen de fondo para mantener la coherencia */
            background-image: url('https://images.unsplash.com/photo-1542831371-29b0f74f9713?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            backdrop-filter: blur(5px);
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 350px;
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 5px;
            border-radius: 50%;
            object-fit: cover;
            content: url('https://cdn-icons-png.flaticon.com/512/860/860162.png');
        }

        h1 {
            color: #e67e22; /* Cambiamos color para diferenciar registro */
            margin-bottom: 0px;
            font-size: 1.6em;
        }

        h2 {
            font-size: 0.95em;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 0.85em;
            color: #34495e;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 0.95em;
            background-color: #fcfcfc;
        }

        input:focus {
            border-color: #e67e22;
            outline: none;
            box-shadow: 0 0 5px rgba(230, 126, 34, 0.5);
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 15px;
        }

        button:hover {
            background-color: #d35400;
        }

        button:active {
            transform: scale(0.98);
        }

        .link {
            display: block;
            margin-top: 15px;
            color: #e67e22;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
        }

        .link:hover {
            text-decoration: underline;
            color: #d35400;
        }

        #errorMsg {
            color: #c0392b;
            font-size: 0.85em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" alt="Logo de la App">
        <h1>Únete a la Defensa (v6)</h1>
        <h2>Crea tu cuenta de comandante</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Nombre de asalto:</label>
                <input type="text" id="username" name="username" placeholder="Tu nombre en el juego">
            </div>
            
            <div class="form-group">
                <label for="email">Correo de contacto:</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña (Mínimo 6 caracteres):</label>
                <input type="password" id="password" name="password" placeholder="Clave de seguridad">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Repetir Contraseña:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirma la clave">
            </div>
            
            <button type="submit">Alistarme</button>
        </form>
        <p id="errorMsg"></p>
        <a href="login.html" class="link">¿Ya eres comandante? Inicia sesión</a>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const confPass = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            if (user === '' || pass === '' || email === '') {
                errorMsg.textContent = "Error: Por favor rellena todos los campos.";
            } else if (pass.length < 6) {
                errorMsg.textContent = "Error: La contraseña debe tener al menos 6 caracteres.";
            } else if (pass !== confPass) {
                errorMsg.textContent = "Error: Las contraseñas no coinciden.";
            } else {
                errorMsg.textContent = "";
                alert("Simulación de registro exitoso (v4).");
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
