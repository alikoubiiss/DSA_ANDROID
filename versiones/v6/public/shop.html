<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - v6 Funcional JS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #1a252f;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 1.5em;
            font-weight: bold;
            color: #3498db;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .balance {
            background-color: #f1c40f;
            color: #2c3e50;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        /* Animación cuando se gasta dinero */
        .balance.updated {
            transform: scale(1.1);
            background-color: #e67e22;
        }

        .logout {
            color: #e74c3c;
            text-decoration: none;
            font-weight: bold;
        }

        .main-container {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex; /* Para poner carrito y tienda lado a lado */
            gap: 30px;
        }

        /* Sección Izquierda: Tienda */
        .shop-section {
            flex: 3;
        }
        
        /* Sección Derecha: Inventario/Carrito */
        .inventory-section {
            flex: 1;
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
        }

        h2.section-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            color: #ecf0f1;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            display: inline-block;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: #1a252f;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #3498db;
        }

        .product-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            padding: 15px;
            box-sizing: border-box;
            background-color: #2c3e50;
        }

        .product-details {
            padding: 15px;
        }
        
        .product-title {
            font-size: 1.1em;
            margin: 0 0 10px 0;
            color: #3498db;
        }

        .product-price {
            font-size: 1em;
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .buy-btn:hover {
            background-color: #2ecc71;
        }
        
        .buy-btn:active {
            transform: scale(0.95);
        }
        
        .buy-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        /* Lista de Inventario */
        ul.inventory-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        
        ul.inventory-list li {
            background-color: #2c3e50;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #3498db;
        }
        
        .item-count {
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8em;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="navbar">
        <div class="navbar-brand">Tower Defense Shop v6</div>
        <div class="user-info">
            <span>Comandante: <strong>Tester_v6</strong></span>
            <div class="balance" id="playerBalance">💰 <span id="balanceValue">1000</span> Monedas</div>
            <a href="login.html" class="logout">Salir</a>
        </div>
    </div>

    <div class="main-container">
        
        <!-- Zona Tienda -->
        <div class="shop-section">
            <h2 class="section-title">Armamento Disponible</h2>
            
            <div class="shop-grid" id="productGrid">
                <!-- Los productos se generarán dinámicamente con JS -->
            </div>
        </div>
        
        <!-- Zona Inventario/Mis Objetos -->
        <div class="inventory-section">
            <h3 style="margin-top:0; color: #3498db;">Mi Arsenal</h3>
            <ul class="inventory-list" id="inventoryList">
                <li style="color: grey; justify-content: center; border: none; background: transparent;">Tu arsenal está vacío.</li>
            </ul>
        </div>

    </div>

    <script>
        // --- 1. DATOS SIMULADOS (En v7 vendrán de la Base de Datos) --- //
        let saldo = 1000;
        let inventario = {}; 
        
        const productos = [
            { id: 1, nombre: "Torreta Básica", precio: 100, img: "https://cdn-icons-png.flaticon.com/512/1155/1155097.png" },
            { id: 2, nombre: "Torreta Láser", precio: 250, img: "https://cdn-icons-png.flaticon.com/512/757/757827.png" },
            { id: 3, nombre: "Lanza-Plasma", precio: 400, img: "https://cdn-icons-png.flaticon.com/512/3255/3255234.png" },
            { id: 4, nombre: "Escudo Deflector", precio: 150, img: "https://cdn-icons-png.flaticon.com/512/860/860162.png" },
            { id: 5, nombre: "Muro Reforzado", precio: 50, img: "https://cdn-icons-png.flaticon.com/512/123/123392.png" }
        ];

        // --- 2. RENDERIZADO INICIAL --- //
        const productGrid = document.getElementById('productGrid');
        const balanceDisplay = document.getElementById('balanceValue');
        const balanceContainer = document.getElementById('playerBalance');
        const inventoryList = document.getElementById('inventoryList');

        function renderStore() {
            productGrid.innerHTML = ''; // Limpiar grid
            
            productos.forEach(prod => {
                // Crear HTML del producto
                const div = document.createElement('div');
                div.className = 'product-card';
                
                // Si no hay saldo, deshabilitar botón
                const disabled = (saldo < prod.precio) ? 'disabled' : '';
                const btnText = (saldo < prod.precio) ? 'Fondos insuficientes' : 'Comprar';

                div.innerHTML = `
                    <div style="background-color: #2c3e50;">
                        <img class="product-img" src="${prod.img}" alt="${prod.nombre}" style="content: url('${prod.img}');">
                    </div>
                    <div class="product-details">
                        <h3 class="product-title">${prod.nombre}</h3>
                        <div class="product-price">${prod.precio} Monedas</div>
                        <button class="buy-btn" ${disabled} onclick="comprar(${prod.id})">${btnText}</button>
                    </div>
                `;
                productGrid.appendChild(div);
            });
        }

        // --- 3. LÓGICA DE COMPRA --- //
        function comprar(idProducto) {
            // Buscar producto
            const prod = productos.find(p => p.id === idProducto);
            
            if (!prod) return;

            // Verificar saldo (aunque el botón esté deshabilitado, doble check)
            if (saldo >= prod.precio) {
                // Descontar saldo
                saldo -= prod.precio;
                
                // Añadir al inventario
                if (inventario[prod.nombre]) {
                    inventario[prod.nombre]++;
                } else {
                    inventario[prod.nombre] = 1;
                }

                // Actualizar UI
                actualizarSaldoUI();
                renderInventory();
                renderStore(); // Re-render para actualizar botones (por si nos quedamos sin dinero)
            } else {
                alert("¡No tienes suficientes monedas para comprar " + prod.nombre + "!");
            }
        }

        // --- 4. ACTUALIZACIÓN DE LA UI --- //
        function actualizarSaldoUI() {
            balanceDisplay.textContent = saldo;
            
            // Animación de flash naranja al gastar
            balanceContainer.classList.add('updated');
            setTimeout(() => {
                balanceContainer.classList.remove('updated');
            }, 200);
        }

        function renderInventory() {
            inventoryList.innerHTML = '';
            
            const items = Object.keys(inventario);
            
            if (items.length === 0) {
                inventoryList.innerHTML = '<li style="color: grey; justify-content: center; border: none; background: transparent;">Tu arsenal está vacío.</li>';
                return;
            }

            items.forEach(itemName => {
                const count = inventario[itemName];
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${itemName}</span>
                    <span class="item-count">x${count}</span>
                `;
                inventoryList.appendChild(li);
            });
        }

        // Iniciar página
        window.onload = () => {
            renderStore();
        };

    </script>
</body>
</html>
